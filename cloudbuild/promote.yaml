# Promotion of a canary revision to 100% traffic, behind two gates (02 §12.1, 03 Phase 6):
#  1. Safety: every `crisis` case must be caught by L1 (gateway) or L2 (agent, real model).
#  2. Personas: every persona users can pick runs an approved card whose latest evaluation was
#     fully rated by its psikolog, all answers safe (`pnpm run eval:personas`).
# A failure stops the build before traffic moves.
#
#   gcloud builds submit --config=cloudbuild/promote.yaml \
#     --substitutions=_SERVICE=gateway,_TAG=sha-abc1234,_MODEL_CHAT=gemini-4-argon
substitutions:
  # Cloud Run and stored data stay in Jakarta; Gemini runs in the US (decision Q7, 02 §9.1).
  _REGION: asia-southeast2
  _MODEL_LOCATION: us
  _SERVICE: gateway
  _TAG: ''
  _MODEL_CHAT: ''
  _CASES: content/evals/safety-cases.draft.json
  _PERSONA_MIN_EVAL_CASES: '5'
availableSecrets:
  secretManager:
    # Read-only connection used to load the *approved* L1 phrases (what production runs).
    - versionName: projects/$PROJECT_ID/secrets/gateway-database-url-readonly/versions/latest
      env: DATABASE_URL
steps:
  - id: eval-l1
    name: node:24-slim
    dir: gateway
    entrypoint: bash
    secretEnv: [DATABASE_URL]
    args:
      - -c
      - |
        set -euo pipefail
        corepack enable && pnpm install --frozen-lockfile
        pnpm run eval:l1 ../${_CASES} /workspace/l1-results.json
  - id: eval-gate
    name: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    dir: agent
    entrypoint: bash
    env:
      - APP_ENV=production
      - MODEL_PROVIDER=vertex
      - MODEL_CHAT=${_MODEL_CHAT}
      - MODEL_DOCUMENT=${_MODEL_CHAT}
      - GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - GOOGLE_CLOUD_LOCATION=${_MODEL_LOCATION}
    args:
      - -c
      - |
        set -euo pipefail
        test -n "${_MODEL_CHAT}"
        uv sync --frozen --no-dev
        uv run python -m evals.safety ../${_CASES} /workspace/l1-results.json
  - id: persona-gate
    name: node:24-slim
    dir: gateway
    entrypoint: bash
    secretEnv: [DATABASE_URL]
    env:
      - PERSONA_MIN_EVAL_CASES=${_PERSONA_MIN_EVAL_CASES}
    args:
      - -c
      - |
        set -euo pipefail
        corepack enable && pnpm install --frozen-lockfile
        pnpm run eval:personas
  - id: promote
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [eval-gate, persona-gate]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        test -n "${_TAG}"
        gcloud run services update-traffic ${_SERVICE} --region=${_REGION} --to-tags=${_TAG}=100
